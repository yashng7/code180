<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>code180 — animated walkthrough</title>
<style>
/* Shared styles for code180 animated walkthroughs — shadcn/ui Default Slate dark theme. */
:root {
  /* shadcn/ui Slate Dark palette */
  --background: #020617;       /* slate-950 */
  --foreground: #f8fafc;       /* slate-50 */
  --card: #0f172a;             /* slate-900 */
  --card-elevated: #131c31;
  --muted: #1e293b;            /* slate-800 */
  --muted-foreground: #94a3b8; /* slate-400 */
  --border: #1e293b;           /* slate-800 */
  --input: #1e293b;            /* slate-800 */
  --ring: #38bdf8;             /* sky-400 / 3b1b accent */
  --accent: #1e293b;           /* slate-800 */
  --accent-foreground: #f8fafc;
  --primary: #f8fafc;          /* slate-50 */
  --primary-foreground: #0f172a;
  --radius: 8px;

  /* 3Blue1Brown stage tokens */
  --blue: #58C4DD;
  --teal: #5CD0B3;
  --green: #83C167;
  --gold: #F0AC5F;
  --red: #FC6255;
  --serif: "Cambria Math", "Latin Modern Math", "STIX Two Math", "Times New Roman", Georgia, serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  background: var(--background);
}

/* --- Top Header Bar (shadcn card header style) --- */
.bar {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(8px);
}
.home-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted-foreground);
  text-decoration: none;
  flex-shrink: 0;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.home-btn:hover {
  background: var(--muted);
  color: var(--foreground);
  border-color: #334155;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-weight: 600;
  font-size: 16px;
  color: var(--foreground);
  letter-spacing: -0.01em;
}
.brand small {
  color: var(--muted-foreground);
  font-size: 12.5px;
  font-weight: 400;
}
.inputs {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-left: auto;
  flex-wrap: wrap;
}
.inputs label {
  color: var(--muted-foreground);
  font-size: 12.5px;
  font-weight: 500;
  display: flex;
  gap: 7px;
  align-items: center;
}
.inputs input, .controls select {
  background: var(--background);
  color: var(--foreground);
  border: 1px solid var(--input);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12.5px;
  font-family: var(--mono);
  height: 32px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.inputs input { width: 150px; }
.inputs input.wide { width: 270px; }
.inputs input.narrow { width: 80px; }
.inputs input:focus, .controls select:focus {
  outline: none;
  border-color: #475569;
  box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.18);
}
input.error {
  border-color: var(--red) !important;
  box-shadow: 0 0 0 2px rgba(252, 98, 85, 0.25) !important;
}

button {
  background: var(--card);
  color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
}
button:hover {
  background: var(--accent);
  border-color: #334155;
}
button:active {
  transform: scale(0.98);
}
#run-btn {
  height: 32px;
  padding: 0 13px;
  background: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
  font-weight: 600;
  font-size: 12.5px;
}
#run-btn:hover {
  background: #e2e8f0;
  border-color: #e2e8f0;
}

/* --- Main Stage + VS Code Resizable Workbench Sidebar --- */
.stage-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: 0;
  padding: 10px 14px;
  position: relative;
}

.video-card {
  flex: 1 1 auto;
  min-width: 200px;
  height: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
}
#stage {
  width: 100%;
  height: 100%;
  display: block;
}
#stage text {
  font-family: var(--serif);
  user-select: none;
}

/* YouTube-style center play/pause bezel animation */
.yt-bezel {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 68px;
  height: 68px;
  margin-left: -34px;
  margin-top: -34px;
  border-radius: 50%;
  background: rgba(15, 23, 42, 0.78);
  border: 1px solid rgba(248, 250, 252, 0.18);
  color: var(--foreground);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.75);
}
.yt-bezel.pop {
  animation: ytBezelPop 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes ytBezelPop {
  0%   { opacity: 0.95; transform: scale(0.8); }
  55%  { opacity: 0.85; transform: scale(1.08); }
  100% { opacity: 0; transform: scale(1.28); }
}

/* YouTube-style top-center HUD toast (for speed / seek feedback) */
.yt-toast {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.88);
  border: 1px solid #334155;
  color: var(--foreground);
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  font-family: var(--mono);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.yt-toast.show {
  opacity: 1;
}

/* --- VS Code Style Resize Sashes --- */
.v-sash {
  flex: 0 0 10px;
  width: 10px;
  cursor: col-resize;
  position: relative;
  user-select: none;
  z-index: 15;
}
.v-sash::after {
  content: "";
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: 4px;
  width: 2px;
  border-radius: 2px;
  background: transparent;
  transition: background-color 0.15s ease;
}
.v-sash:hover::after,
.v-sash.dragging::after {
  background: var(--ring);
}
.stage-wrap.sidebar-collapsed .v-sash {
  display: none;
}

.h-sash {
  flex: 0 0 6px;
  height: 6px;
  cursor: row-resize;
  background: #020617;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  position: relative;
  user-select: none;
  z-index: 15;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.h-sash:hover,
.h-sash.dragging {
  background: var(--ring);
  border-color: var(--ring);
}
.h-sash.hidden {
  display: none;
}

/* --- Collapsible Timestamps + Code Sidebar (shadcn Slate card) --- */
.transcript {
  flex: 0 0 var(--sidebar-w, 400px);
  width: var(--sidebar-w, 400px);
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.stage-wrap.sidebar-collapsed .transcript {
  flex: 0 0 0px !important;
  width: 0px !important;
  border-width: 0;
}

/* Workbench Pane (Timestamps or Code) */
.wb-pane {
  flex: 1 1 50%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--card);
  position: relative;
}
.code-pane {
  background: #090e1a;
}
.wb-pane.closed,
.wb-pane.hidden {
  display: none !important;
}

/* Accordion Minimize / Fold state (VS Code Explorer style) */
.wb-pane.folded {
  flex: 0 0 auto !important;
  height: auto !important;
}
.wb-pane.folded .t-list,
.wb-pane.folded .code-list,
.wb-pane.folded .pip-resize {
  display: none !important;
}

/* Floating Picture-in-Picture (PiP) Mode */
.wb-pane.pip {
  position: fixed !important;
  z-index: 80;
  width: 410px;
  height: 290px;
  min-width: 240px;
  min-height: 44px;
  flex: none !important;
  border: 1px solid #334155;
  border-radius: 10px;
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(56, 189, 248, 0.22);
  overflow: hidden;
}
.wb-pane.pip.code-pane {
  background: rgba(9, 14, 26, 0.95);
}
.wb-pane.pip .t-head,
.wb-pane.pip .code-head {
  cursor: move;
  user-select: none;
  background: rgba(2, 6, 23, 0.78);
}
.wb-pane.pip .pip-btn {
  color: var(--ring);
  background: rgba(56, 189, 248, 0.14);
  border-color: rgba(56, 189, 248, 0.35);
}
.pip-resize {
  display: none;
}
.wb-pane.pip:not(.folded) .pip-resize {
  display: block;
  position: absolute;
  right: 0;
  bottom: 0;
  width: 16px;
  height: 16px;
  cursor: nwse-resize;
  z-index: 5;
  background: linear-gradient(135deg, transparent 50%, rgba(148, 163, 184, 0.45) 50%);
  border-bottom-right-radius: 9px;
}

.t-head, .code-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  background: rgba(2, 6, 23, 0.45);
  flex-shrink: 0;
}
.t-head-titles {
  min-width: 0;
  flex: 1;
}
.t-title {
  font-weight: 600;
  font-size: 13px;
  color: var(--foreground);
  letter-spacing: -0.01em;
}
.t-head small, .code-head small {
  display: block;
  color: var(--muted-foreground);
  font-size: 10.5px;
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pane-actions {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}
.fold-btn {
  font-size: 13px;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
.wb-pane.folded .fold-btn {
  transform: rotate(-90deg);
}
.code-line-badge {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ring);
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 5px;
  padding: 2px 7px;
  white-space: nowrap;
  flex-shrink: 0;
}
.icon-btn {
  width: 24px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--muted-foreground);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
}
.icon-btn:hover {
  color: var(--foreground);
  background: var(--muted);
  border-color: #334155;
}

.t-list {
  list-style: none;
  margin: 0;
  padding: 6px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: #334155 transparent;
}
.t-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 8px;
  margin-bottom: 2px;
  border-radius: 6px;
  border-left: 2px solid transparent;
  cursor: pointer;
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.36;
  opacity: 0.62;
  transition: background-color 0.12s, opacity 0.12s, border-color 0.12s;
}
.t-row.past {
  opacity: 0.78;
}
.t-row:hover {
  background: rgba(30, 41, 59, 0.65);
  opacity: 1;
}
.t-row.current {
  opacity: 1;
  background: var(--muted);
  border-left-color: var(--ring);
  box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.14);
}
.t-badges {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  flex: none;
  margin-top: 1px;
}
.t-time {
  color: var(--ring);
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.22);
  border-radius: 4px;
  padding: 1px 6px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.45;
  flex: none;
}
.t-line-tag {
  color: #4ade80;
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.24);
  border-radius: 4px;
  padding: 0 5px;
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.35;
}
.t-row.current .t-time {
  background: rgba(56, 189, 248, 0.2);
  border-color: rgba(56, 189, 248, 0.45);
  font-weight: 600;
}
.t-text {
  white-space: pre-wrap;
  word-break: break-word;
  flex: 1;
}

/* --- Scrollable Code Execution Panel --- */
.code-list {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 6px 0;
  font-family: var(--mono);
  font-size: 12.2px;
  line-height: 1.62;
  scrollbar-width: thin;
  scrollbar-color: #334155 transparent;
}
.code-line {
  display: flex;
  align-items: baseline;
  padding: 1px 12px 1px 0;
  border-left: 3px solid transparent;
  color: #94a3b8;
  cursor: pointer;
  user-select: text;
  transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}
.code-line:hover {
  background: rgba(30, 41, 59, 0.45);
  color: #e2e8f0;
}
.code-line.active {
  background: rgba(56, 189, 248, 0.15);
  border-left-color: var(--ring);
  color: var(--foreground);
  box-shadow: inset 0 1px 0 rgba(56, 189, 248, 0.12),
              inset 0 -1px 0 rgba(56, 189, 248, 0.12);
}
.c-gutter {
  width: 44px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  padding-right: 10px;
  font-size: 11px;
  color: #475569;
  user-select: none;
}
.c-arrow {
  color: var(--ring);
  font-size: 9px;
  opacity: 0;
  transform: translateX(-2px);
  transition: opacity 0.12s ease, transform 0.12s ease;
}
.code-line.active .c-arrow {
  opacity: 1;
  transform: translateX(0);
}
.code-line.active .c-num {
  color: var(--ring);
  font-weight: 700;
}
.c-code {
  white-space: pre;
  flex: 1;
}
.tok-kw  { color: #c084fc; font-weight: 500; }
.tok-fn  { color: #38bdf8; }
.tok-num { color: #f59e0b; }
.tok-str { color: #4ade80; }
.tok-com { color: #64748b; font-style: italic; }

/* --- Player Footer (shadcn Slate + YouTube controls) --- */
.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 16px 10px;
  border-top: 1px solid var(--border);
  background: var(--card);
}
.scrub-row {
  display: flex;
  align-items: center;
  width: 100%;
}
#scrub {
  width: 100%;
  height: 5px;
  margin: 0;
  cursor: pointer;
  accent-color: var(--ring);
  background: var(--muted);
  border-radius: 999px;
}
.ctrl-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.ctrl-left, .ctrl-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctrl-btn {
  height: 32px;
  min-width: 34px;
  padding: 0 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 14px;
  background: var(--background);
  border: 1px solid var(--border);
  color: var(--foreground);
  border-radius: 6px;
}
.ctrl-btn:hover {
  background: var(--muted);
  border-color: #334155;
}
.ctrl-btn.primary {
  background: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
  font-weight: 600;
}
.ctrl-btn.primary:hover {
  background: #e2e8f0;
  border-color: #e2e8f0;
}
.pill-btn {
  font-size: 12px;
  padding: 0 11px;
  color: var(--muted-foreground);
}
.pill-btn.active {
  background: var(--muted);
  color: var(--foreground);
  border-color: #334155;
}
.clock {
  color: var(--muted-foreground);
  font-family: var(--mono);
  font-size: 12px;
  margin-left: 6px;
  white-space: nowrap;
}
.controls .speed {
  color: var(--muted-foreground);
  font-size: 12px;
  font-weight: 500;
  display: flex;
  gap: 6px;
  align-items: center;
}
.controls select {
  height: 32px;
  padding: 0 8px;
}
.legend {
  display: flex;
  gap: 14px;
  color: var(--muted-foreground);
  font-size: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.legend i {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c);
  margin-right: 5px;
}

@media (max-width: 980px) {
  .stage-wrap { flex-direction: column; }
  .transcript { flex: 0 0 210px; width: 100%; }
  .stage-wrap.sidebar-collapsed .transcript { flex: 0 0 0px; height: 0; }
}
@media (max-width: 760px) {
  .legend { display: none; }
}

</style>
</head>
<body>
<div class="app-shell" id="app-shell">
  <header class="bar">
    <a class="home-btn" href="../../../index.html" title="Home" aria-label="Home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5" />
        <path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9" />
        <path d="M9 20v-6h6v6" />
      </svg>
    </a>
    <div class="brand" id="brand"></div>
    <div class="inputs" id="inputs"></div>
  </header>

  <main class="stage-wrap" id="stage-wrap">
    <div class="video-card" id="video-card" title="Click to play/pause (Space/K) · Double-click for fullscreen (F)">
      <svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="step-by-step algorithm animation"></svg>
      <div class="yt-bezel" id="yt-bezel" aria-hidden="true"></div>
      <div class="yt-toast" id="yt-toast" aria-hidden="true"></div>
    </div>

    <div class="v-sash" id="sidebar-sash" title="Drag to resize sidebar · Double-click to reset"></div>

    <aside class="transcript" id="timestamps-panel" aria-label="workbench panels">
      <!-- Panel 1: Timestamps -->
      <div class="wb-pane" id="t-pane" data-pane="timestamps">
        <div class="t-head" id="t-head">
          <button class="icon-btn fold-btn" id="t-fold-btn" title="Minimize / Expand Timestamps">▾</button>
          <div class="t-head-titles">
            <span class="t-title">Timestamps</span>
            <small id="t-count-label">Click any timestamp to jump · ‹ › step</small>
          </div>
          <div class="pane-actions">
            <button class="icon-btn pip-btn" id="t-pip-btn" title="Float / Pin anywhere on screen (PiP mode)">⧉</button>
            <button class="icon-btn t-close-btn" id="t-close-btn" title="Close Timestamps tab (T)">✕</button>
          </div>
        </div>
        <ol class="t-list" id="transcript-list"></ol>
        <div class="pip-resize" id="t-pip-resize" title="Drag to resize floating window"></div>
      </div>

      <div class="h-sash" id="pane-sash" title="Drag to resize Timestamps / Code split · Double-click to reset"></div>

      <!-- Panel 2: Code -->
      <div class="wb-pane code-pane" id="code-pane" data-pane="code">
        <div class="code-head" id="code-head">
          <button class="icon-btn fold-btn" id="c-fold-btn" title="Minimize / Expand Code">▾</button>
          <div class="t-head-titles">
            <span class="t-title">Code · solution.py</span>
            <small id="code-status-label">Executing line for current timestamp</small>
          </div>
          <span class="code-line-badge" id="code-line-badge">Line —</span>
          <div class="pane-actions">
            <button class="icon-btn pip-btn" id="c-pip-btn" title="Float / Pin anywhere on screen (PiP mode)">⧉</button>
            <button class="icon-btn t-close-btn" id="c-close-btn" title="Close Code tab (C)">✕</button>

  <footer class="controls">
    <div class="scrub-row">

    </div>

      <div class="ctrl-left">
        <button id="play-btn" class="ctrl-btn primary" title="Play / Pause (Space or K)">▶</button>
        <button id="prev-btn" class="ctrl-btn" title="Previous timestamp (← or ,)">‹</button>
        <button id="next-btn" class="ctrl-btn" title="Next timestamp (→ or .)">›</button>

        <label class="speed" title="Playback speed (< / >)">
          <span>Speed</span>
          <select id="speed-select">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>

        <button id="sidebar-toggle-btn" class="ctrl-btn pill-btn active" title="Toggle Timestamps tab (T)">
          <span>Timestamps</span>
        </button>
        <button id="code-toggle-btn" class="ctrl-btn pill-btn active" title="Toggle Code tab (C)">
          <span>Code</span>

        <button id="fullscreen-btn" class="ctrl-btn" title="Fullscreen (F or double-click video)">⛶</button>
      </div>
    </div>
