<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>code180 — animated walkthrough</title>
<style>
/* Shared styles for code180 animated walkthroughs — shadcn/ui Default Slate dark theme. */
:root {
  /* shadcn/ui Slate Dark palette */
  --background: #020617;       /* slate-950 */
  --foreground: #f8fafc;       /* slate-50 */
  --card: #0f172a;             /* slate-900 */
  --card-elevated: #131c31;
  --muted: #1e293b;            /* slate-800 */
  --muted-foreground: #94a3b8; /* slate-400 */
  --border: #1e293b;           /* slate-800 */
  --input: #1e293b;            /* slate-800 */
  --ring: #38bdf8;             /* sky-400 / 3b1b accent */
  --accent: #1e293b;           /* slate-800 */
  --accent-foreground: #f8fafc;
  --primary: #f8fafc;          /* slate-50 */
  --primary-foreground: #0f172a;
  --radius: 8px;

  /* 3Blue1Brown stage tokens */
  --blue: #58C4DD;
  --teal: #5CD0B3;
  --green: #83C167;
  --gold: #F0AC5F;
  --red: #FC6255;
  --serif: "Cambria Math", "Latin Modern Math", "STIX Two Math", "Times New Roman", Georgia, serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  background: var(--background);
}

/* --- Top Header Bar (shadcn card header style) --- */
.bar {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(8px);
}
.home-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted-foreground);
  text-decoration: none;
  flex-shrink: 0;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.home-btn:hover {
  background: var(--muted);
  color: var(--foreground);
  border-color: #334155;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-weight: 600;
  font-size: 16px;
  color: var(--foreground);
  letter-spacing: -0.01em;
}
.brand small {
  color: var(--muted-foreground);
  font-size: 12.5px;
  font-weight: 400;
}
.inputs {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-left: auto;
  flex-wrap: wrap;
}
.inputs label {
  color: var(--muted-foreground);
  font-size: 12.5px;
  font-weight: 500;
  display: flex;
  gap: 7px;
  align-items: center;
}
.inputs input, .controls select {
  background: var(--background);
  color: var(--foreground);
  border: 1px solid var(--input);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12.5px;
  font-family: var(--mono);
  height: 32px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.inputs input { width: 150px; }
.inputs input.wide { width: 270px; }
.inputs input.narrow { width: 80px; }
.inputs input:focus, .controls select:focus {
  outline: none;
  border-color: #475569;
  box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.18);
}
input.error {
  border-color: var(--red) !important;
  box-shadow: 0 0 0 2px rgba(252, 98, 85, 0.25) !important;
}

button {
  background: var(--card);
  color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
}
button:hover {
  background: var(--accent);
  border-color: #334155;
}
button:active {
  transform: scale(0.98);
}
#run-btn {
  height: 32px;
  padding: 0 13px;
  background: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
  font-weight: 600;
  font-size: 12.5px;
}
#run-btn:hover {
  background: #e2e8f0;
  border-color: #e2e8f0;
}

/* --- Main Stage + VS Code Resizable Workbench Sidebar --- */
.stage-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: 0;
  padding: 10px 14px;
  position: relative;
}

.video-card {
  flex: 1 1 auto;
  min-width: 200px;
  height: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
}
#stage {
  width: 100%;
  height: 100%;
  display: block;
}
#stage text {
  font-family: var(--serif);
  user-select: none;
}

/* YouTube-style center play/pause bezel animation */
.yt-bezel {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 68px;
  height: 68px;
  margin-left: -34px;
  margin-top: -34px;
  border-radius: 50%;
  background: rgba(15, 23, 42, 0.78);
  border: 1px solid rgba(248, 250, 252, 0.18);
  color: var(--foreground);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.75);
}
.yt-bezel.pop {
  animation: ytBezelPop 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes ytBezelPop {
  0%   { opacity: 0.95; transform: scale(0.8); }
  55%  { opacity: 0.85; transform: scale(1.08); }
  100% { opacity: 0; transform: scale(1.28); }
}

/* YouTube-style top-center HUD toast (for speed / seek feedback) */
.yt-toast {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.88);
  border: 1px solid #334155;
  color: var(--foreground);
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  font-family: var(--mono);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.yt-toast.show {
  opacity: 1;
}

/* --- VS Code Style Resize Sashes --- */
.v-sash {
  flex: 0 0 10px;
  width: 10px;
  cursor: col-resize;
  position: relative;
  user-select: none;
  z-index: 15;
}
.v-sash::after {
  content: "";
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: 4px;
  width: 2px;
  border-radius: 2px;
  background: transparent;
  transition: background-color 0.15s ease;
}
.v-sash:hover::after,
.v-sash.dragging::after {
  background: var(--ring);
}
.stage-wrap.sidebar-collapsed .v-sash {
  display: none;
}

.h-sash {
  flex: 0 0 6px;
  height: 6px;
  cursor: row-resize;
  background: #020617;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  position: relative;
  user-select: none;
  z-index: 15;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.h-sash:hover,
.h-sash.dragging {
  background: var(--ring);
  border-color: var(--ring);
}
.h-sash.hidden {
  display: none;
}

/* --- Collapsible Timestamps + Code Sidebar (shadcn Slate card) --- */
.transcript {
  flex: 0 0 var(--sidebar-w, 400px);
  width: var(--sidebar-w, 400px);
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.stage-wrap.sidebar-collapsed .transcript {
  flex: 0 0 0px !important;
  width: 0px !important;
  border-width: 0;
}

/* Workbench Pane (Timestamps or Code) */
.wb-pane {
  flex: 1 1 50%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--card);
  position: relative;
}
.code-pane {
  background: #090e1a;
}
.wb-pane.closed,
.wb-pane.hidden {
  display: none !important;
}

/* Accordion Minimize / Fold state (VS Code Explorer style) */
.wb-pane.folded {
  flex: 0 0 auto !important;
  height: auto !important;
}
.wb-pane.folded .t-list,
.wb-pane.folded .code-list,
.wb-pane.folded .pip-resize {
  display: none !important;
}

/* Floating Picture-in-Picture (PiP) Mode */
.wb-pane.pip {
  position: fixed !important;
  z-index: 80;
  width: 410px;
  height: 290px;
  min-width: 240px;
  min-height: 44px;
  flex: none !important;
  border: 1px solid #334155;
  border-radius: 10px;
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(56, 189, 248, 0.22);
  overflow: hidden;
}
.wb-pane.pip.code-pane {
  background: rgba(9, 14, 26, 0.95);
}
.wb-pane.pip .t-head,
.wb-pane.pip .code-head {
  cursor: move;
  user-select: none;
  background: rgba(2, 6, 23, 0.78);
}
.wb-pane.pip .pip-btn {
  color: var(--ring);
  background: rgba(56, 189, 248, 0.14);
  border-color: rgba(56, 189, 248, 0.35);
}
.pip-resize {
  display: none;
}
.wb-pane.pip:not(.folded) .pip-resize {
  display: block;
  position: absolute;
  right: 0;
  bottom: 0;
  width: 16px;
  height: 16px;
  cursor: nwse-resize;
  z-index: 5;
  background: linear-gradient(135deg, transparent 50%, rgba(148, 163, 184, 0.45) 50%);
  border-bottom-right-radius: 9px;
}

.t-head, .code-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  background: rgba(2, 6, 23, 0.45);
  flex-shrink: 0;
}
.t-head-titles {
  min-width: 0;
  flex: 1;
}
.t-title {
  font-weight: 600;
  font-size: 13px;
  color: var(--foreground);
  letter-spacing: -0.01em;
}
.t-head small, .code-head small {
  display: block;
  color: var(--muted-foreground);
  font-size: 10.5px;
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pane-actions {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}
.fold-btn {
  font-size: 13px;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
.wb-pane.folded .fold-btn {
  transform: rotate(-90deg);
}
.code-line-badge {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ring);
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 5px;
  padding: 2px 7px;
  white-space: nowrap;
  flex-shrink: 0;
}
.icon-btn {
  width: 24px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--muted-foreground);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
}
.icon-btn:hover {
  color: var(--foreground);
  background: var(--muted);
  border-color: #334155;
}

.t-list {
  list-style: none;
  margin: 0;
  padding: 6px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: #334155 transparent;
}
.t-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 8px;
  margin-bottom: 2px;
  border-radius: 6px;
  border-left: 2px solid transparent;
  cursor: pointer;
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.36;
  opacity: 0.62;
  transition: background-color 0.12s, opacity 0.12s, border-color 0.12s;
}
.t-row.past {
  opacity: 0.78;
}
.t-row:hover {
  background: rgba(30, 41, 59, 0.65);
  opacity: 1;
}
.t-row.current {
  opacity: 1;
  background: var(--muted);
  border-left-color: var(--ring);
  box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.14);
}
.t-badges {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  flex: none;
  margin-top: 1px;
}
.t-time {
  color: var(--ring);
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.22);
  border-radius: 4px;
  padding: 1px 6px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.45;
  flex: none;
}
.t-line-tag {
  color: #4ade80;
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.24);
  border-radius: 4px;
  padding: 0 5px;
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.35;
}
.t-row.current .t-time {
  background: rgba(56, 189, 248, 0.2);
  border-color: rgba(56, 189, 248, 0.45);
  font-weight: 600;
}
.t-text {
  white-space: pre-wrap;
  word-break: break-word;
  flex: 1;
}

/* --- Scrollable Code Execution Panel --- */
.code-list {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 6px 0;
  font-family: var(--mono);
  font-size: 12.2px;
  line-height: 1.62;
  scrollbar-width: thin;
  scrollbar-color: #334155 transparent;
}
.code-line {
  display: flex;
  align-items: baseline;
  padding: 1px 12px 1px 0;
  border-left: 3px solid transparent;
  color: #94a3b8;
  cursor: pointer;
  user-select: text;
  transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}
.code-line:hover {
  background: rgba(30, 41, 59, 0.45);
  color: #e2e8f0;
}
.code-line.active {
  background: rgba(56, 189, 248, 0.15);
  border-left-color: var(--ring);
  color: var(--foreground);
  box-shadow: inset 0 1px 0 rgba(56, 189, 248, 0.12),
              inset 0 -1px 0 rgba(56, 189, 248, 0.12);
}
.c-gutter {
  width: 44px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  padding-right: 10px;
  font-size: 11px;
  color: #475569;
  user-select: none;
}
.c-arrow {
  color: var(--ring);
  font-size: 9px;
  opacity: 0;
  transform: translateX(-2px);
  transition: opacity 0.12s ease, transform 0.12s ease;
}
.code-line.active .c-arrow {
  opacity: 1;
  transform: translateX(0);
}
.code-line.active .c-num {
  color: var(--ring);
  font-weight: 700;
}
.c-code {
  white-space: pre;
  flex: 1;
}
.tok-kw  { color: #c084fc; font-weight: 500; }
.tok-fn  { color: #38bdf8; }
.tok-num { color: #f59e0b; }
.tok-str { color: #4ade80; }
.tok-com { color: #64748b; font-style: italic; }

/* --- Player Footer (shadcn Slate + YouTube controls) --- */
.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 16px 10px;
  border-top: 1px solid var(--border);
  background: var(--card);
}
.scrub-row {
  display: flex;
  align-items: center;
  width: 100%;
}
#scrub {
  width: 100%;
  height: 5px;
  margin: 0;
  cursor: pointer;
  accent-color: var(--ring);
  background: var(--muted);
  border-radius: 999px;
}
.ctrl-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.ctrl-left, .ctrl-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctrl-btn {
  height: 32px;
  min-width: 34px;
  padding: 0 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 14px;
  background: var(--background);
  border: 1px solid var(--border);
  color: var(--foreground);
  border-radius: 6px;
}
.ctrl-btn:hover {
  background: var(--muted);
  border-color: #334155;
}
.ctrl-btn.primary {
  background: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
  font-weight: 600;
}
.ctrl-btn.primary:hover {
  background: #e2e8f0;
  border-color: #e2e8f0;
}
.pill-btn {
  font-size: 12px;
  padding: 0 11px;
  color: var(--muted-foreground);
}
.pill-btn.active {
  background: var(--muted);
  color: var(--foreground);
  border-color: #334155;
}
.clock {
  color: var(--muted-foreground);
  font-family: var(--mono);
  font-size: 12px;
  margin-left: 6px;
  white-space: nowrap;
}
.controls .speed {
  color: var(--muted-foreground);
  font-size: 12px;
  font-weight: 500;
  display: flex;
  gap: 6px;
  align-items: center;
}
.controls select {
  height: 32px;
  padding: 0 8px;
}
.legend {
  display: flex;
  gap: 14px;
  color: var(--muted-foreground);
  font-size: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.legend i {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c);
  margin-right: 5px;
}

@media (max-width: 980px) {
  .stage-wrap { flex-direction: column; }
  .transcript { flex: 0 0 210px; width: 100%; }
  .stage-wrap.sidebar-collapsed .transcript { flex: 0 0 0px; height: 0; }
}
@media (max-width: 760px) {
  .legend { display: none; }
}

</style>
</head>
<body>
<div class="app-shell" id="app-shell">
  <header class="bar">
    <a class="home-btn" href="../../../index.html" title="Home" aria-label="Home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5" />
        <path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9" />
        <path d="M9 20v-6h6v6" />
      </svg>
    </a>
    <div class="brand" id="brand"></div>
    <div class="inputs" id="inputs"></div>
  </header>

  <main class="stage-wrap" id="stage-wrap">
    <div class="video-card" id="video-card" title="Click to play/pause (Space/K) · Double-click for fullscreen (F)">
      <svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="step-by-step algorithm animation"></svg>
      <div class="yt-bezel" id="yt-bezel" aria-hidden="true"></div>
      <div class="yt-toast" id="yt-toast" aria-hidden="true"></div>
    </div>

    <div class="v-sash" id="sidebar-sash" title="Drag to resize sidebar · Double-click to reset"></div>

    <aside class="transcript" id="timestamps-panel" aria-label="workbench panels">
      <!-- Panel 1: Timestamps -->
      <div class="wb-pane" id="t-pane" data-pane="timestamps">
        <div class="t-head" id="t-head">
          <button class="icon-btn fold-btn" id="t-fold-btn" title="Minimize / Expand Timestamps">▾</button>
          <div class="t-head-titles">
            <span class="t-title">Timestamps</span>
            <small id="t-count-label">Click any timestamp to jump · ‹ › step</small>
          </div>
          <div class="pane-actions">
            <button class="icon-btn pip-btn" id="t-pip-btn" title="Float / Pin anywhere on screen (PiP mode)">⧉</button>
            <button class="icon-btn t-close-btn" id="t-close-btn" title="Close Timestamps tab (T)">✕</button>
          </div>
        </div>
        <ol class="t-list" id="transcript-list"></ol>
        <div class="pip-resize" id="t-pip-resize" title="Drag to resize floating window"></div>
      </div>

      <div class="h-sash" id="pane-sash" title="Drag to resize Timestamps / Code split · Double-click to reset"></div>

      <!-- Panel 2: Code -->
      <div class="wb-pane code-pane" id="code-pane" data-pane="code">
        <div class="code-head" id="code-head">
          <button class="icon-btn fold-btn" id="c-fold-btn" title="Minimize / Expand Code">▾</button>
          <div class="t-head-titles">
            <span class="t-title">Code · solution.py</span>
            <small id="code-status-label">Executing line for current timestamp</small>
          </div>
          <span class="code-line-badge" id="code-line-badge">Line —</span>
          <div class="pane-actions">
            <button class="icon-btn pip-btn" id="c-pip-btn" title="Float / Pin anywhere on screen (PiP mode)">⧉</button>
            <button class="icon-btn t-close-btn" id="c-close-btn" title="Close Code tab (C)">✕</button>

  <footer class="controls">
    <div class="scrub-row">

    </div>

      <div class="ctrl-left">
        <button id="play-btn" class="ctrl-btn primary" title="Play / Pause (Space or K)">▶</button>
        <button id="prev-btn" class="ctrl-btn" title="Previous timestamp (← or ,)">‹</button>
        <button id="next-btn" class="ctrl-btn" title="Next timestamp (→ or .)">›</button>

        <label class="speed" title="Playback speed (< / >)">
          <span>Speed</span>
          <select id="speed-select">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>

        <button id="sidebar-toggle-btn" class="ctrl-btn pill-btn active" title="Toggle Timestamps tab (T)">
          <span>Timestamps</span>
        </button>
        <button id="code-toggle-btn" class="ctrl-btn pill-btn active" title="Toggle Code tab (C)">
          <span>Code</span>

        <button id="fullscreen-btn" class="ctrl-btn" title="Fullscreen (F or double-click video)">⛶</button>
      </div>
    </div>

<script>
/* code180 mini-Manim engine — shared, problem-agnostic, inlined at build time.
 *
 * A scene module (global `SCENE`) supplies the problem-specific story:
 *
 *   meta        : { title, subtitle,
 *                   inputs: [{ id, label, type, default, width? }],
 *                   legend: [{ color, text }] }
 *   read(v)     : v = {inputId: rawString} -> params object, or null if invalid
 *   fromArgs(a) : optional; parsed ?args= JSON list -> {inputId: rawString}
 *   buildScene(params, ctx)      : returns a scene object (may define scene.reset)
 *   buildTimeline(scene, tl, ctx): schedules eased actions onto tl (a Timeline)
 *
 * Everything is a pure function of time: `Timeline.render(t)` resets to the
 * build-time baseline and replays, so scrubbing backwards is always correct.
 */
"use strict";

const NS = "http://www.w3.org/2000/svg";
const STAGE_W = 1280;
const STAGE_H = 720;

const C = {
  white: "#ececec",
  grey: "#6b7684",
  greyDark: "#2a3342",
  blue: "#58C4DD",
  teal: "#5CD0B3",
  green: "#83C167",
  gold: "#F0AC5F",
  red: "#FC6255",
  purple: "#B58CD6",
  chipFill: "#151b26",
  stage: "#0d1117",
};

const ease = {
  linear: u => u,
  inOutSine: u => -(Math.cos(Math.PI * u) - 1) / 2,
  outCubic: u => 1 - Math.pow(1 - u, 3),
  outBack: u => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
  },
};

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* Learning pace: every scheduled duration (actions and waits) is stretched by
 * this factor, so scenes can be authored at "natural" speed while the page
 * plays slowly enough to follow. 1 = authored speed; raise it to slow down.
 * The speed menu (0.25× … 2×) still multiplies on top of this. */
const PACE = 1.75;

function el(tag, attrs, parent) {
  const node = document.createElementNS(NS, tag);
  if (attrs) for (const key in attrs) node.setAttribute(key, attrs[key]);
  if (parent) parent.appendChild(node);
  return node;
}

function txt(str, attrs, parent) {
  const node = el("text", attrs, parent);
  node.textContent = str;
  return node;
}

const setOpacity = (node, o) => { node.style.opacity = String(clamp(o, 0, 1)); };
const setTranslate = (node, x, y) => node.setAttribute("transform", "translate(" + x + " " + y + ")");
const setScaleAt = (node, cx, cy, s) =>
  node.setAttribute("transform", "translate(" + cx + " " + cy + ") scale(" + s + ") translate(" + -cx + " " + -cy + ")");

/* ------------------------------------------------------------------ *
 * Narration transcript helpers
 * ------------------------------------------------------------------ */

/* Reading time added after every narration line, in authored seconds (PACE
 * still applies): a base plus a per-character allowance, clamped. */
const READ_BASE = 0.6;
const READ_PER_CHAR = 0.035;
const READ_MIN = 1.0;
const READ_MAX = 3.0;
const readingTime = text => clamp(READ_BASE + text.length * READ_PER_CHAR, READ_MIN, READ_MAX);

/* Split an SVG <text> (optionally built from coloured <tspan>s) into
 * [{ text, fill }] runs so the transcript keeps the stage's colours. */
function richParts(node) {
  const base = (node.getAttribute && node.getAttribute("fill")) || C.white;
  const kids = node.children ? Array.from(node.children) : [];
  if (kids.length) {
    return kids.map(k => ({
      text: k.textContent || "",
      fill: (k.getAttribute && k.getAttribute("fill")) || base,
    }));
  }
  return [{ text: node.textContent || "", fill: base }];
}

/* ------------------------------------------------------------------ *
 * Seekable timeline
 *
 * Every write-on text (a writer from ctx.makeWritable) is recorded in
 * `transcript` and followed by an automatic reading pause. Scenes that change
 * text by hand can call `tl.log(text, color)` to do the same.
 * ------------------------------------------------------------------ */
class Timeline {
  constructor() {
    this.actions = [];
    this.duration = 0;
    this.resetFn = null;
    this.transcript = [];
    this.lineEvents = [];
    this._currentLines = [];
  }
  /* Mark which 1-based source code line(s) are executing from this point on. */
  line(lines) {
    const arr = Array.isArray(lines) ? lines.map(Number) : (lines ? [Number(lines)] : []);
    this._currentLines = arr;
    const marker = { start: 0, dur: 0, apply: () => {}, easeFn: ease.linear, lines: arr };
    this.actions.push(marker);
    this.lineEvents.push({ action: marker, lines: arr });
    return this;
  }
  add(dur, apply, easeFn) {
    const curLines = (apply && apply.lines) ? (Array.isArray(apply.lines) ? apply.lines : [apply.lines]) : this._currentLines.slice();
    const action = { start: 0, dur: dur * PACE, apply, easeFn: easeFn || ease.inOutSine, lines: curLines };
    this.actions.push(action);
    if (apply && apply.node && !apply.noLog) {
      const y = Number(apply.node.getAttribute && apply.node.getAttribute("y")) || 0;
      if (y > 95) {
        const parts = richParts(apply.node);
        const text = parts.map(p => p.text).join("").trim();
        if (text) {
          this.transcript.push({ action, parts, text, lines: curLines });
          this._hold(text);
        }
      }
    }
    return this;
  }
  wait(dur) { return this.add(dur, () => {}, ease.linear); }
  /* Record a narration line that the scene displays by other means. */
  log(text, color, opts) {
    text = String(text);
    const curLines = (opts && opts.lines) ? (Array.isArray(opts.lines) ? opts.lines : [opts.lines]) : this._currentLines.slice();
    const action = { start: 0, dur: 0, apply: () => {}, easeFn: ease.linear, lines: curLines };
    this.actions.push(action);
    this.transcript.push({ action, parts: [{ text, fill: color || C.white }], text, lines: curLines });
    if (!opts || opts.hold !== false) this._hold(text);
    return this;
  }
  _hold(text) {
    this.actions.push({
      start: 0,
      dur: readingTime(text) * PACE,
      apply: () => {},
      easeFn: ease.linear,
      lines: this._currentLines.slice(),
    });
  }
  finish() {
    let t = 0;
    for (const a of this.actions) { a.start = t; t += a.dur; }
    this.duration = t;
    return this;
  }
  linesAt(t) {
    let active = [];
    for (const le of this.lineEvents) {
      if (le.action.start <= t + 1e-4) active = le.lines;
      else break;
    }
    return active;
  }
  render(t) {
    t = clamp(t, 0, this.duration);
    if (this.resetFn) this.resetFn();
    for (const a of this.actions) {
      if (t < a.start) continue;
      const raw = a.dur <= 0 ? 1 : clamp((t - a.start) / a.dur, 0, 1);
      a.apply(a.easeFn(raw), raw);
    }
  }
  /* Step targets: the moment each narration line has finished writing. */
  stops() {
    if (!this.transcript.length) return this.actions.map(a => a.start);
    return this.transcript.map(e => e.action.start + e.action.dur);
  }
  nextStop(t) {
    for (const s of this.stops()) if (s > t + 1e-4) return s;
    return this.duration;
  }
  prevStop(t) {
    let best = 0;
    for (const s of this.stops()) if (s < t - 1e-4) best = s;
    return best;
  }
}

/* ------------------------------------------------------------------ *
 * Stage context handed to a scene
 * ------------------------------------------------------------------ */
let clipSeq = 0;

function createContext(stage) {
  while (stage.firstChild) stage.removeChild(stage.firstChild);
  const defs = el("defs", {}, stage);
  clipSeq = 0;

  const layers = {};
  const layer = name => {
    if (!layers[name]) layers[name] = el("g", {}, stage);
    return layers[name];
  };
  layer("bg"); layer("arcs"); layer("chips"); layer("pointer"); layer("text"); layer("result");

  const glow = (id, color) => {
    const f = el("filter", { id, x: "-60%", y: "-60%", width: "220%", height: "220%" }, defs);
    el("feDropShadow", { dx: 0, dy: 0, stdDeviation: 6.5, "flood-color": color, "flood-opacity": 0.9 }, f);
    return id;
  };

  const makeWritable = () => {
    return function writable(node, pad) {
      pad = pad === undefined ? 14 : pad;
      let rect = null, x0 = 0, full = 0;
      node.style.opacity = "0";
      const writer = u => {
        const clamped = clamp(u, 0, 1);
        if (clamped <= 0) {
          if (rect) rect.setAttribute("width", "0");
          node.style.opacity = "0";
          return;
        }
        if (!rect) {
          const b = node.getBBox();
          let bx = b.x, bw = b.width;
          if (node.getAttribute("text-anchor") === "middle" && node.getAttribute("x") != null) {
            const cx = Number(node.getAttribute("x"));
            const half = Math.max(bw / 2, cx - bx, (bx + bw) - cx) + pad;
            bx = cx - half;
            bw = half * 2;
          }
          x0 = bx - pad;
          full = bw + 2 * pad;
          const cp = el("clipPath", { id: "write-clip-" + (clipSeq++) }, defs);
          rect = el("rect", {
            x: x0, y: b.y - pad, width: 0, height: Math.max(b.height, 16) + 2 * pad,
          }, cp);
          node.setAttribute("clip-path", "url(#" + cp.id + ")");
        }
        if (clamped >= 0.999) {
          rect.setAttribute("x", "0");
          rect.setAttribute("width", String(STAGE_W));
        } else {
          rect.setAttribute("x", String(x0));
          rect.setAttribute("width", String(full * clamped));
        }
        node.style.opacity = "1";
      };
      writer.reset = () => {
        if (rect) {
          rect.setAttribute("x", String(x0));
          rect.setAttribute("width", "0");
        }
        node.style.opacity = "0";
      };
      // Lets Timeline.add recognise a write-on and log it to the transcript.
      writer.node = node;
      return writer;
    };
  };

  const backdrop = () => {
    const bg = layers.bg;
    const dots = el("pattern", { id: "dots", width: 44, height: 44, patternUnits: "userSpaceOnUse" }, defs);
    el("circle", { cx: 2, cy: 2, r: 1.4, fill: "#1b2433" }, dots);
    el("rect", { x: 0, y: 0, width: STAGE_W, height: STAGE_H, fill: C.stage }, bg);
    el("rect", { x: 0, y: 0, width: STAGE_W, height: STAGE_H, fill: "url(#dots)" }, bg);
    const vig = el("radialGradient", { id: "vignette", cx: "50%", cy: "40%", r: "78%" }, defs);
    el("stop", { offset: "0%", "stop-color": "#ffffff", "stop-opacity": 0.05 }, vig);
    el("stop", { offset: "55%", "stop-color": "#000000", "stop-opacity": 0 }, vig);
    el("stop", { offset: "100%", "stop-color": "#000000", "stop-opacity": 0.55 }, vig);
    el("rect", { x: 0, y: 0, width: STAGE_W, height: STAGE_H, fill: "url(#vignette)" }, bg);
  };

  return {
    stage, defs, layers, layer, glow, backdrop, makeWritable,
    el, txt, C, ease, clamp, setOpacity, setTranslate, setScaleAt, Timeline,
    NS, STAGE_W, STAGE_H,
  };
}

/* ------------------------------------------------------------------ *
 * Header inputs + legend
 * ------------------------------------------------------------------ */
function buildInputs(meta, onChange) {
  const host = document.getElementById("inputs");
  host.innerHTML = "";
  const map = {};
  for (const spec of meta.inputs || []) {
    const label = document.createElement("label");
    label.textContent = spec.label;
    const input = document.createElement("input");
    input.id = spec.id + "-input";
    input.spellcheck = false;
    if (spec.type === "number") input.type = "number";
    if (spec.width) input.classList.add(spec.width);
    if (spec.default != null) input.value = String(spec.default);
    input.addEventListener("keydown", ev => { if (ev.key === "Enter") onChange(); });
    label.appendChild(input);
    host.appendChild(label);
    map[spec.id] = input;
  }
  const run = document.createElement("button");
  run.id = "run-btn";
  run.textContent = "Animate ⏎";
  run.addEventListener("click", onChange);
  host.appendChild(run);
  return map;
}

function buildLegend(meta, brandEl) {
  brandEl.innerHTML = "";
  const title = document.createElement("span");
  title.textContent = meta.title || "code180";
  brandEl.appendChild(title);
  if (meta.subtitle) {
    const small = document.createElement("small");
    small.textContent = meta.subtitle;
    brandEl.appendChild(small);
  }
  const host = document.getElementById("legend");
  host.innerHTML = "";
  for (const item of meta.legend || []) {
    const span = document.createElement("span");
    const dot = document.createElement("i");
    dot.style.setProperty("--c", item.color);
    span.appendChild(dot);
    span.appendChild(document.createTextNode(item.text));
    host.appendChild(span);
  }
}

/* ------------------------------------------------------------------ *
 * Boot / player
 * ------------------------------------------------------------------ */
const ui = {
  appShell: document.getElementById("app-shell"),
  stageWrap: document.getElementById("stage-wrap"),
  videoCard: document.getElementById("video-card"),
  bezel: document.getElementById("yt-bezel"),
  toast: document.getElementById("yt-toast"),
  play: document.getElementById("play-btn"),
  prev: document.getElementById("prev-btn"),
  next: document.getElementById("next-btn"),
  restart: document.getElementById("restart-btn"),
  speed: document.getElementById("speed-select"),
  sidebar: document.getElementById("timestamps-panel"),
  sidebarSash: document.getElementById("sidebar-sash"),
  paneSash: document.getElementById("pane-sash"),
  tPane: document.getElementById("t-pane"),
  tHead: document.getElementById("t-head"),
  tFold: document.getElementById("t-fold-btn"),
  tPip: document.getElementById("t-pip-btn"),
  tClose: document.getElementById("t-close-btn"),
  tPipResize: document.getElementById("t-pip-resize"),
  codePane: document.getElementById("code-pane"),
  cHead: document.getElementById("code-head"),
  cFold: document.getElementById("c-fold-btn"),
  cPip: document.getElementById("c-pip-btn"),
  cClose: document.getElementById("c-close-btn"),
  cPipResize: document.getElementById("c-pip-resize"),
  sidebarToggle: document.getElementById("sidebar-toggle-btn"),
  codeToggle: document.getElementById("code-toggle-btn"),
  fullscreen: document.getElementById("fullscreen-btn"),
  scrub: document.getElementById("scrub"),
  clock: document.getElementById("clock"),
  stage: document.getElementById("stage"),
  transcript: document.getElementById("transcript-list"),
  tCountLabel: document.getElementById("t-count-label"),
  codeList: document.getElementById("code-list"),
  codeLineBadge: document.getElementById("code-line-badge"),
};

let scene = null, timeline = null, duration = 0, tNow = 0;
let playing = false, speed = 1, lastTs = 0, scrubbing = false, wasPlaying = false;
let toastTimer = null;

const SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
const fmtTime = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

function setPlaying(v) { playing = v; ui.play.textContent = v ? "❚❚" : "▶"; }
function syncClock() { ui.clock.textContent = fmtTime(tNow) + " / " + fmtTime(duration); }
function syncScrub() {
  ui.scrub.max = String(Math.max(1, Math.round(duration * 1000)));
  if (!scrubbing) ui.scrub.value = String(Math.round(tNow * 1000));
}

function flashBezel(symbol) {
  if (!ui.bezel || !ui.bezel.classList) return;
  ui.bezel.textContent = symbol;
  ui.bezel.classList.remove("pop");
  if (ui.bezel.offsetWidth !== undefined) void ui.bezel.offsetWidth;
  ui.bezel.classList.add("pop");
}

function showToast(msg) {
  if (!ui.toast || !ui.toast.classList) return;
  ui.toast.textContent = msg;
  ui.toast.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ui.toast.classList.remove("show"), 950);
}

/* ------------------------------------------------------------------ *
 * Timestamps sidebar: ALL timestamps are always shown so the user can
 * jump forward or backward to any step at any time without losing later
 * timestamps. The active timestamp is highlighted.
 * ------------------------------------------------------------------ */
const panelColor = fill => (fill === C.grey ? "#94a3b8" : fill);
let tEntries = [], tActive = -2;
let codeRows = [], cActiveKey = "";

const PY_KW = new Set([
  "def", "return", "for", "in", "if", "elif", "else", "while",
  "not", "and", "or", "True", "False", "None", "class", "pass", "break", "continue",
]);
const PY_FN = new Set([
  "enumerate", "range", "len", "min", "max", "sum", "sorted", "zip", "int", "str", "list", "dict", "set",
]);

function highlightPyLine(rawLine, container) {
  let codePart = rawLine;
  let commentPart = "";
  const hashIdx = rawLine.indexOf("#");
  if (hashIdx >= 0) {
    codePart = rawLine.slice(0, hashIdx);
    commentPart = rawLine.slice(hashIdx);
  }
  const tokenRe = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|\b[A-Za-z_]\w*\b|\b\d+\b)/g;
  let lastIdx = 0;
  let m;
  while ((m = tokenRe.exec(codePart)) !== null) {
    if (m.index > lastIdx) {
      const plain = document.createElement("span");
      plain.textContent = codePart.slice(lastIdx, m.index);
      container.appendChild(plain);
    }
    const tok = m[0];
    const span = document.createElement("span");
    span.textContent = tok;
    if (tok[0] === '"' || tok[0] === "'") span.className = "tok-str";
    else if (/^\d+$/.test(tok)) span.className = "tok-num";
    else if (PY_KW.has(tok)) span.className = "tok-kw";
    else if (PY_FN.has(tok)) span.className = "tok-fn";
    container.appendChild(span);
    lastIdx = tokenRe.lastIndex;
  }
  if (lastIdx < codePart.length) {
    const tail = document.createElement("span");
    tail.textContent = codePart.slice(lastIdx);
    container.appendChild(tail);
  }
  if (commentPart) {
    const com = document.createElement("span");
    com.className = "tok-com";
    com.textContent = commentPart;
    container.appendChild(com);
  }
}

function buildCode() {
  const pane = ui.codePane;
  const host = ui.codeList;
  if (!pane || !host) return;
  host.innerHTML = "";
  codeRows = [];
  cActiveKey = "";

  const rawCode = SCENE.code;
  if (!rawCode) {
    if (pane.classList) pane.classList.add("hidden");
    if (ui.codeToggle) ui.codeToggle.style.display = "none";
    syncWorkbenchLayout();
    return;
  }
  if (pane.classList) pane.classList.remove("hidden");
  if (ui.codeToggle) ui.codeToggle.style.display = "";
  const lines = Array.isArray(rawCode) ? rawCode : String(rawCode).split("\n");

  lines.forEach((lineStr, idx) => {
    const lineNo = idx + 1;
    const row = document.createElement("div");
    row.className = "code-line";
    row.title = "Click to jump to next execution of line " + lineNo;

    const gutter = document.createElement("span");
    gutter.className = "c-gutter";
    const arrow = document.createElement("span");
    arrow.className = "c-arrow";
    arrow.textContent = "▶";
    const num = document.createElement("span");
    num.className = "c-num";
    num.textContent = String(lineNo);
    gutter.appendChild(arrow);
    gutter.appendChild(num);

    const codeSpan = document.createElement("span");
    codeSpan.className = "c-code";
    highlightPyLine(lineStr, codeSpan);

    row.appendChild(gutter);
    row.appendChild(codeSpan);

    row.addEventListener("click", () => {
      if (!timeline) return;
      // Jump to the next timestamp or lineEvent that executes lineNo
      const matchingStops = tEntries
        .filter(e => e.lines && e.lines.indexOf(lineNo) >= 0)
        .map(e => e.at);
      if (!matchingStops.length) {
        for (const le of timeline.lineEvents) {
          if (le.lines && le.lines.indexOf(lineNo) >= 0) matchingStops.push(le.action.start + 0.01);
        }
      }
      if (matchingStops.length) {
        const ahead = matchingStops.find(s => s > tNow + 0.05);
        seekTo(ahead !== undefined ? ahead : matchingStops[0]);
      }
    });

    host.appendChild(row);
    codeRows.push({ lineNo, row });
  });
  syncWorkbenchLayout();
}

function syncCode() {
  if (!codeRows.length || !timeline) return;
  // Prefer the active timestamp's lines if we are at/inside a timestamp, or timeline.linesAt(tNow)
  let activeLines = timeline.linesAt(tNow);
  if ((!activeLines || !activeLines.length) && tActive >= 0 && tEntries[tActive] && tEntries[tActive].lines) {
    activeLines = tEntries[tActive].lines;
  }
  const key = (activeLines || []).join(",");
  if (key === cActiveKey) return;
  cActiveKey = key;

  const set = new Set(activeLines || []);
  let firstActiveRow = null;
  for (const cr of codeRows) {
    if (set.has(cr.lineNo)) {
      cr.row.className = "code-line active";
      if (!firstActiveRow) firstActiveRow = cr.row;
    } else {
      cr.row.className = "code-line";
    }
  }

  if (ui.codeLineBadge) {
    if (activeLines && activeLines.length === 1) {
      ui.codeLineBadge.textContent = "Line " + activeLines[0];
    } else if (activeLines && activeLines.length > 1) {
      ui.codeLineBadge.textContent = "Lines " + activeLines.join(", ");
    } else {
      ui.codeLineBadge.textContent = "Line —";
    }
  }

  if (firstActiveRow && typeof firstActiveRow.scrollIntoView === "function") {
    firstActiveRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

function buildTranscript() {
  const host = ui.transcript;
  if (!host) return;
  host.innerHTML = "";
  tEntries = timeline.transcript.map((entry, i) => {
    const row = document.createElement("li");
    row.className = "t-row";
    const at = entry.action.start + entry.action.dur;
    const lineInfo = entry.lines && entry.lines.length ? " · Line " + entry.lines.join(",") : "";
    row.title = "Jump to " + fmtTime(entry.action.start) + " (step " + (i + 1) + lineInfo + ")";

    const badges = document.createElement("div");
    badges.className = "t-badges";

    const timeBadge = document.createElement("span");
    timeBadge.className = "t-time";
    timeBadge.textContent = fmtTime(entry.action.start);
    badges.appendChild(timeBadge);

    if (entry.lines && entry.lines.length) {
      const lineTag = document.createElement("span");
      lineTag.className = "t-line-tag";
      lineTag.textContent = "L" + entry.lines.join(",");
      badges.appendChild(lineTag);
    }

    row.appendChild(badges);

    const body = document.createElement("span");
    body.className = "t-text";
    for (const part of entry.parts) {
      const span = document.createElement("span");
      span.textContent = part.text;
      span.style.color = panelColor(part.fill);
      body.appendChild(span);
    }
    row.appendChild(body);
    row.addEventListener("click", () => seekTo(at));
    host.appendChild(row);
    return { row, start: entry.action.start, at, lines: entry.lines || [] };
  });
  if (ui.tCountLabel) {
    ui.tCountLabel.textContent = tEntries.length + " steps · click any timestamp to jump";
  }
  tActive = -2;
  syncTranscript();
}

function syncTranscript() {
  let active = -1;
  for (let i = 0; i < tEntries.length; i++) {
    if (tEntries[i].start <= tNow + 1e-4) active = i;
    else break;
  }
  if (active === tActive) return;
  tEntries.forEach((e, i) => {
    if (i === active) e.row.className = "t-row current";
    else if (i < active) e.row.className = "t-row past";
    else e.row.className = "t-row";
  });
  tActive = active;
  const cur = tEntries[active];
  if (cur && typeof cur.row.scrollIntoView === "function") {
    cur.row.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

/* Render the current time everywhere (stage, scrubber, clock, timestamps, code). */
function show() {
  timeline.render(tNow);
  syncScrub(); syncClock(); syncTranscript(); syncCode();
}

function seekTo(t, keepPlaying) {
  if (!timeline) return;
  tNow = clamp(t, 0, duration); lastTs = 0;
  if (!keepPlaying) setPlaying(false);
  show();
}

function togglePlay(withBezel) {
  if (!timeline) return;
  if (tNow >= duration) tNow = 0;
  lastTs = 0;
  setPlaying(!playing);
  if (withBezel) flashBezel(playing ? "▶" : "❚❚");
}

let splitRatio = 0.52;
let sidebarWidth = 400;
let pipZ = 80;

function hasClass(node, cls) {
  return !!(node && node.classList && node.classList.contains(cls));
}

function syncWorkbenchLayout() {
  const tPane = ui.tPane;
  const cPane = ui.codePane;
  if (!tPane || !cPane) return;

  const tOpen = !hasClass(tPane, "closed") && !hasClass(tPane, "hidden");
  const cOpen = !hasClass(cPane, "closed") && !hasClass(cPane, "hidden");
  const tPip = hasClass(tPane, "pip");
  const cPip = hasClass(cPane, "pip");
  const tFold = hasClass(tPane, "folded");
  const cFold = hasClass(cPane, "folded");

  if (ui.sidebarToggle && ui.sidebarToggle.classList) {
    if (tOpen) ui.sidebarToggle.classList.add("active");
    else ui.sidebarToggle.classList.remove("active");
  }
  if (ui.codeToggle && ui.codeToggle.classList) {
    if (cOpen) ui.codeToggle.classList.add("active");
    else ui.codeToggle.classList.remove("active");
  }

  const tDocked = tOpen && !tPip;
  const cDocked = cOpen && !cPip;

  // Collapse the sidebar container whenever no panes are docked in it
  if (ui.stageWrap && ui.stageWrap.classList) {
    if (!tDocked && !cDocked) ui.stageWrap.classList.add("sidebar-collapsed");
    else ui.stageWrap.classList.remove("sidebar-collapsed");
  }

  // Show the horizontal split sash only when BOTH panes are docked and neither is folded
  if (ui.paneSash && ui.paneSash.classList) {
    if (tDocked && cDocked && !tFold && !cFold) ui.paneSash.classList.remove("hidden");
    else ui.paneSash.classList.add("hidden");
  }

  // Compute flex sizing for docked panes
  if (tDocked && cDocked) {
    if (!tFold && !cFold) {
      tPane.style.flex = "0 0 " + Math.round(splitRatio * 100) + "%";
      cPane.style.flex = "1 1 0%";
    } else if (tFold && !cFold) {
      tPane.style.flex = "0 0 auto";
      cPane.style.flex = "1 1 auto";
    } else if (!tFold && cFold) {
      tPane.style.flex = "1 1 auto";
      cPane.style.flex = "0 0 auto";
    } else {
      tPane.style.flex = "0 0 auto";
      cPane.style.flex = "0 0 auto";
    }
  } else if (tDocked) {
    tPane.style.flex = tFold ? "0 0 auto" : "1 1 auto";
  } else if (cDocked) {
    cPane.style.flex = cFold ? "0 0 auto" : "1 1 auto";
  }
}

function togglePaneOpen(pane, label) {
  if (!pane || !pane.classList || hasClass(pane, "hidden")) return;
  const closed = pane.classList.toggle("closed");
  syncWorkbenchLayout();
  showToast(label + (closed ? " closed" : " opened"));
}

function togglePaneFold(pane) {
  if (!pane || !pane.classList) return;
  const folded = pane.classList.toggle("folded");
  if (hasClass(pane, "pip")) {
    if (folded) {
      pane.dataset.prevH = pane.style.height || "290px";
      pane.style.height = "auto";
    } else {
      pane.style.height = pane.dataset.prevH || "290px";
    }
  }
  syncWorkbenchLayout();
}

function togglePanePip(pane, btn, defaultTop, defaultLeft) {
  if (!pane || !pane.classList || !ui.sidebar || !ui.appShell) return;
  const isNowPip = pane.classList.toggle("pip");
  if (isNowPip) {
    pane.style.zIndex = String(++pipZ);
    pane.style.top = pane.dataset.pipTop || defaultTop;
    pane.style.left = pane.dataset.pipLeft || defaultLeft;
    pane.style.width = pane.dataset.pipW || "420px";
    pane.style.height = hasClass(pane, "folded") ? "auto" : (pane.dataset.pipH || "290px");
    if (btn) {
      btn.textContent = "↙";
      btn.title = "Dock back into sidebar";
    }
    ui.appShell.appendChild(pane);
    showToast("Pinned in PiP mode · drag header to move");
  } else {
    pane.style.top = "";
    pane.style.left = "";
    pane.style.width = "";
    pane.style.height = "";
    pane.style.zIndex = "";
    if (btn) {
      btn.textContent = "⧉";
      btn.title = "Float / Pin anywhere on screen (PiP mode)";
    }
    // Re-insert into sidebar in canonical order: t-pane, pane-sash, code-pane
    if (pane === ui.tPane && ui.paneSash) {
      ui.sidebar.insertBefore(pane, ui.paneSash);
    } else {
      ui.sidebar.appendChild(pane);
    }
    showToast("Docked to sidebar");
  }
  syncWorkbenchLayout();
}

function wirePipDragAndResize(pane, head, resizeGrip) {
  if (!pane || !head) return;
  head.addEventListener("pointerdown", ev => {
    if (!hasClass(pane, "pip")) return;
    const tag = (ev.target && ev.target.tagName || "").toLowerCase();
    if (tag === "button" || (ev.target && ev.target.closest && ev.target.closest("button"))) return;
    ev.preventDefault();
    pane.style.zIndex = String(++pipZ);
    const rect = pane.getBoundingClientRect();
    const startX = ev.clientX;
    const startY = ev.clientY;
    const origLeft = rect.left;
    const origTop = rect.top;

    const onMove = me => {
      const nx = clamp(origLeft + (me.clientX - startX), 8, Math.max(8, window.innerWidth - rect.width - 8));
      const ny = clamp(origTop + (me.clientY - startY), 8, Math.max(8, window.innerHeight - 48));
      pane.style.left = nx + "px";
      pane.style.top = ny + "px";
      pane.dataset.pipLeft = pane.style.left;
      pane.dataset.pipTop = pane.style.top;
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });

  // Double-clicking header toggles fold/minimize just like VS Code
  head.addEventListener("dblclick", ev => {
    const tag = (ev.target && ev.target.tagName || "").toLowerCase();
    if (tag === "button" || (ev.target && ev.target.closest && ev.target.closest("button"))) return;
    togglePaneFold(pane);
  });

  if (resizeGrip) {
    resizeGrip.addEventListener("pointerdown", ev => {
      if (!hasClass(pane, "pip")) return;
      ev.preventDefault();
      ev.stopPropagation();
      pane.style.zIndex = String(++pipZ);
      const rect = pane.getBoundingClientRect();
      const startX = ev.clientX;
      const startY = ev.clientY;
      const origW = rect.width;
      const origH = rect.height;

      const onMove = me => {
        const nw = clamp(origW + (me.clientX - startX), 260, Math.min(820, window.innerWidth - rect.left - 8));
        const nh = clamp(origH + (me.clientY - startY), 120, Math.min(720, window.innerHeight - rect.top - 8));
        pane.style.width = nw + "px";
        pane.style.height = nh + "px";
        pane.dataset.pipW = pane.style.width;
        pane.dataset.pipH = pane.style.height;
      };
      const onUp = () => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    });
  }
}

function wireSashes() {
  if (ui.sidebarSash && ui.sidebar) {
    ui.sidebarSash.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      ui.sidebarSash.classList.add("dragging");
      const startX = ev.clientX;
      const startW = ui.sidebar.getBoundingClientRect().width || sidebarWidth;
      const onMove = me => {
        sidebarWidth = clamp(startW - (me.clientX - startX), 250, Math.min(760, window.innerWidth - 260));
        ui.sidebar.style.setProperty("--sidebar-w", sidebarWidth + "px");
      };
      const onUp = () => {
        ui.sidebarSash.classList.remove("dragging");
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    });
    ui.sidebarSash.addEventListener("dblclick", () => {
      sidebarWidth = 400;
      ui.sidebar.style.setProperty("--sidebar-w", "400px");
    });
  }

  if (ui.paneSash && ui.sidebar) {
    ui.paneSash.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      ui.paneSash.classList.add("dragging");
      const sbRect = ui.sidebar.getBoundingClientRect();
      const onMove = me => {
        if (sbRect.height <= 0) return;
        splitRatio = clamp((me.clientY - sbRect.top) / sbRect.height, 0.16, 0.84);
        syncWorkbenchLayout();
      };
      const onUp = () => {
        ui.paneSash.classList.remove("dragging");
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    });
    ui.paneSash.addEventListener("dblclick", () => {
      splitRatio = 0.52;
      syncWorkbenchLayout();
    });
  }
}

function toggleFullscreen() {
  const target = ui.appShell || document.documentElement;
  if (!document.fullscreenElement) {
    if (target && typeof target.requestFullscreen === "function") {
      target.requestFullscreen().catch(() => {});
    }
  } else if (typeof document.exitFullscreen === "function") {
    document.exitFullscreen().catch(() => {});
  }
}

function stepSpeed(delta) {
  const idx = SPEEDS.indexOf(speed);
  const nextIdx = clamp((idx < 0 ? 3 : idx) + delta, 0, SPEEDS.length - 1);
  speed = SPEEDS[nextIdx];
  if (ui.speed) ui.speed.value = String(speed);
  showToast(speed + "×");
}

function run(params) {
  const ctx = createContext(ui.stage);
  scene = SCENE.buildScene(params, ctx);
  timeline = new Timeline();
  SCENE.buildTimeline(scene, timeline, ctx);
  timeline.finish();
  timeline.resetFn = scene.reset || null;
  duration = timeline.duration;
  tNow = 0; lastTs = 0;
  buildCode();
  buildTranscript();
  show(); setPlaying(true);
}

function loop(ts) {
  if (playing && timeline) {
    if (lastTs) tNow += (ts - lastTs) / 1000 * speed;
    if (tNow >= duration) { tNow = duration; setPlaying(false); }
    show();
  }
  lastTs = ts;
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------------ *
 * Parameter plumbing
 * ------------------------------------------------------------------ */
function readValues(inputsMap) {
  const values = {};
  for (const id in inputsMap) values[id] = inputsMap[id].value;
  return values;
}

function fromQuery() {
  const params = new URLSearchParams(window.location.search);
  const seeded = {};
  for (const spec of SCENE.meta.inputs || []) {
    if (params.has(spec.id)) seeded[spec.id] = params.get(spec.id);
  }
  if (params.has("args")) {
    try {
      const args = JSON.parse(params.get("args"));
      if (Array.isArray(args) && typeof SCENE.fromArgs === "function") {
        const mapped = SCENE.fromArgs(args);
        if (mapped) Object.assign(seeded, mapped);
      }
    } catch (err) { /* keep whatever we have */ }
  }
  return seeded;
}

function flashError() {
  for (const input of document.querySelectorAll(".inputs input")) {
    input.classList.add("error");
    setTimeout(() => input.classList.remove("error"), 700);
  }
}

function mount() {
  const meta = SCENE.meta || {};
  document.title = (meta.title || "code180") + " — animated walkthrough";
  const inputsMap = buildInputs(meta, () => runFromInputs(inputsMap));
  buildLegend(meta, document.getElementById("brand"));

  const seeded = fromQuery();
  for (const id in seeded) if (inputsMap[id]) inputsMap[id].value = seeded[id];
  if (!runFromInputs(inputsMap, true)) {
    for (const spec of meta.inputs || []) {
      const input = inputsMap[spec.id];
      if (input && spec.default != null) input.value = String(spec.default);
    }
    runFromInputs(inputsMap, true);
  }
}

function runFromInputs(inputsMap, quiet) {
  const values = readValues(inputsMap);
  const params = SCENE.read(values);
  if (!params) { if (!quiet) flashError(); return false; }
  run(params);
  return true;
}

ui.play.addEventListener("click", () => togglePlay(true));
ui.restart.addEventListener("click", () => {
  if (!timeline) return;
  tNow = 0; lastTs = 0; show(); setPlaying(true);
  showToast("0:00");
});
// ‹ / › step from one timestamp to the next (fully written).
ui.next.addEventListener("click", () => {
  if (!timeline) return;
  seekTo(timeline.nextStop(tNow));
});
ui.prev.addEventListener("click", () => {
  if (!timeline) return;
  seekTo(timeline.prevStop(tNow));
});
ui.speed.addEventListener("change", () => {
  speed = Number(ui.speed.value);
  showToast(speed + "×");
});
if (ui.sidebarToggle) ui.sidebarToggle.addEventListener("click", () => togglePaneOpen(ui.tPane, "Timestamps"));
if (ui.codeToggle) ui.codeToggle.addEventListener("click", () => togglePaneOpen(ui.codePane, "Code"));
if (ui.tClose) ui.tClose.addEventListener("click", () => togglePaneOpen(ui.tPane, "Timestamps"));
if (ui.cClose) ui.cClose.addEventListener("click", () => togglePaneOpen(ui.codePane, "Code"));
if (ui.tFold) ui.tFold.addEventListener("click", () => togglePaneFold(ui.tPane));
if (ui.cFold) ui.cFold.addEventListener("click", () => togglePaneFold(ui.codePane));
if (ui.tPip) ui.tPip.addEventListener("click", () => togglePanePip(ui.tPane, ui.tPip, "68px", "24px"));
if (ui.cPip) ui.cPip.addEventListener("click", () => togglePanePip(ui.codePane, ui.cPip, "380px", "24px"));
wirePipDragAndResize(ui.tPane, ui.tHead, ui.tPipResize);
wirePipDragAndResize(ui.codePane, ui.cHead, ui.cPipResize);
wireSashes();
if (ui.fullscreen) ui.fullscreen.addEventListener("click", toggleFullscreen);

// YouTube-style video canvas click = play/pause, double-click = fullscreen
if (ui.videoCard) {
  ui.videoCard.addEventListener("click", () => togglePlay(true));
  ui.videoCard.addEventListener("dblclick", ev => {
    ev.preventDefault();
    toggleFullscreen();
  });
}

ui.scrub.addEventListener("pointerdown", () => { scrubbing = true; wasPlaying = playing; setPlaying(false); });
ui.scrub.addEventListener("input", () => {
  if (!timeline) return;
  tNow = Number(ui.scrub.value) / 1000; timeline.render(tNow); syncClock(); syncTranscript();
});
const scrubEnd = () => {
  if (!scrubbing) return;
  scrubbing = false; lastTs = 0;
  if (wasPlaying) setPlaying(true);
};
ui.scrub.addEventListener("pointerup", scrubEnd);
ui.scrub.addEventListener("change", scrubEnd);

// YouTube-style keyboard shortcuts
document.addEventListener("keydown", ev => {
  const tag = (ev.target && ev.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

  const key = ev.key;
  const lower = key.toLowerCase();

  if (ev.code === "Space" || lower === "k") {
    ev.preventDefault();
    togglePlay(true);
  } else if (key === "ArrowRight" || key === ".") {
    ev.preventDefault();
    ui.next.click();
  } else if (key === "ArrowLeft" || key === ",") {
    ev.preventDefault();
    ui.prev.click();
  } else if (lower === "l") {
    ev.preventDefault();
    seekTo(tNow + 5 * speed, playing);
    showToast("+5s");
  } else if (lower === "j") {
    ev.preventDefault();
    seekTo(tNow - 5 * speed, playing);
    showToast("-5s");
  } else if (key === ">" || (ev.shiftKey && key === ".")) {
    ev.preventDefault();
    stepSpeed(1);
  } else if (key === "<" || (ev.shiftKey && key === ",")) {
    ev.preventDefault();
    stepSpeed(-1);
  } else if (lower === "f") {
    ev.preventDefault();
    toggleFullscreen();
  } else if (lower === "t") {
    ev.preventDefault();
    togglePaneOpen(ui.tPane, "Timestamps");
  } else if (lower === "c") {
    ev.preventDefault();
    togglePaneOpen(ui.codePane, "Code");
  } else if (lower === "r") {
    ev.preventDefault();
    ui.restart.click();
  } else if (key === "Home" || key === "0") {
    ev.preventDefault();
    seekTo(0, playing);
    showToast("0:00");
  } else if (key === "End") {
    ev.preventDefault();
    seekTo(duration, false);
  } else if (key >= "1" && key <= "9") {
    ev.preventDefault();
    const pct = Number(key) * 10;
    seekTo(duration * (pct / 100), playing);
    showToast(pct + "%");
  }
});

/* The scene module lives in a later <script>, so boot once parsing is done. */
function start() {
  mount();
  requestAnimationFrame(loop);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", start);
} else {
  start();
}

</script>
<script>
/* Shared Topic 11 scene kit.
 *
 * These helpers are inlined into every Topic 11 scene so each generated page
 * stays completely self-contained.  They only cover presentation scaffolding;
 * every algorithm, simulation and timeline remains in the problem scene.
 */
"use strict";

function kClamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function kHeader(ctx, scene, title, subtitle) {
  const { txt, C, setOpacity, STAGE_W } = ctx;
  scene.title = txt(title, {
    x: 64, y: 62, "font-size": 40, fill: C.white, "letter-spacing": 0.4,
  }, scene.layers.text);
  scene.titleWriter = ctx.makeWritable()(scene.title);
  scene.writers.push(scene.titleWriter);
  scene.subtitle = txt(subtitle, {
    x: 64, y: 98, "font-size": 17, fill: C.grey,
  }, scene.layers.text);
  setOpacity(scene.subtitle, 0);
  scene.hideNodes.push(scene.subtitle);
}

function kBase(ctx, scene) {
  scene.ctx = ctx;
  scene.layers = {
    arcs: ctx.layer("arcs"),
    chips: ctx.layer("chips"),
    text: ctx.layer("text"),
    result: ctx.layer("result"),
  };
  scene.hideNodes = [];
  scene.introNodes = [];
  scene.writers = [];
  scene.resetters = [];
  scene.reset = () => {
    for (const w of scene.writers) w.reset();
    for (const node of scene.hideNodes) ctx.setOpacity(node, 0);
    for (const fn of scene.resetters) fn();
  };
}

function kPanel(ctx, scene, x, y, w, h, title, color, opts) {
  const { el, txt, C, setOpacity } = ctx;
  const o = opts || {};
  const g = el("g", {}, scene.layers.chips);
  const rect = el("rect", {
    x, y, width: w, height: h, rx: 14,
    fill: o.fill || "#0f141c",
    stroke: o.stroke || C.greyDark,
    "stroke-width": o.strokeWidth || 1.5,
  }, g);
  setOpacity(g, 0);
  scene.hideNodes.push(g);
  scene.introNodes.push(g);
  let titleNode = null;
  if (title) {
    titleNode = txt(title, {
      x: x + 20, y: y + 30, "font-size": 18, fill: color || C.blue,
    }, scene.layers.text);
    setOpacity(titleNode, 0);
    scene.hideNodes.push(titleNode);
    scene.introNodes.push(titleNode);
  }
  return { g, rect, title: titleNode, x, y, w, h };
}

function kGrid(ctx, scene, grid, opts) {
  const { el, txt, C, setOpacity } = ctx;
  const o = opts || {};
  const rows = grid.length;
  const cols = grid[0].length;
  const maxCell = o.maxCell || 58;
  const cell = Math.min(maxCell, (o.w - 34) / cols, (o.h - 54) / rows);
  const bw = cell * cols;
  const bh = cell * rows;
  const x0 = o.x + (o.w - bw) / 2;
  const y0 = o.y + (o.h - bh) / 2 + (o.label ? 8 : 0);
  const board = el("g", {}, scene.layers.chips);
  setOpacity(board, 0);
  scene.hideNodes.push(board);
  scene.introNodes.push(board);
  const cells = [];
  const font = kClamp(cell * 0.36, 9, 24);
  const gap = Math.min(3, Math.max(1.5, cell * 0.04));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = x0 + c * cell;
      const y = y0 + r * cell;
      const g = el("g", {}, board);
      const rect = el("rect", {
        x: x + gap / 2, y: y + gap / 2,
        width: cell - gap, height: cell - gap, rx: Math.min(8, cell * 0.18),
        fill: C.chipFill, stroke: C.greyDark, "stroke-width": 1.6,
      }, g);
      const t = txt("", {
        x: x + cell / 2, y: y + cell / 2 + 1,
        "text-anchor": "middle", "dominant-baseline": "central",
        "font-size": font, fill: C.white,
      }, g);
      cells.push({ r, c, x, y, cx: x + cell / 2, cy: y + cell / 2, g, rect, t });
    }
  }
  if (o.label) {
    const labels = el("g", {}, scene.layers.text);
    setOpacity(labels, 0);
    scene.hideNodes.push(labels);
    scene.introNodes.push(labels);
    for (let c = 0; c < cols; c++) {
      const t = txt(String(c), {
        x: x0 + c * cell + cell / 2, y: y0 - 8,
        "text-anchor": "middle", "font-size": 10, fill: C.grey,
      }, labels);
      setOpacity(t, 0.8);
    }
    for (let r = 0; r < rows; r++) {
      const t = txt(String(r), {
        x: x0 - 10, y: y0 + r * cell + cell / 2 + 1,
        "text-anchor": "middle", "dominant-baseline": "central",
        "font-size": 10, fill: C.grey,
      }, labels);
      setOpacity(t, 0.8);
    }
  }
  const cursor = el("rect", {
    x: 0, y: 0, width: cell - gap, height: cell - gap,
    rx: Math.min(8, cell * 0.18), fill: "none", stroke: C.gold,
    "stroke-width": 3, filter: "url(#glow-gold)",
  }, board);
  setOpacity(cursor, 0);

  let styleFn = o.style || ((v) => ({
    fill: C.chipFill, stroke: C.greyDark, text: C.white,
  }));
  let displayFn = o.display || ((v) => String(v));

  const applyNow = (snapshot, extra, active) => {
    for (const cell of cells) {
      const value = snapshot ? snapshot[cell.r][cell.c] : grid[cell.r][cell.c];
      const st = styleFn(value, cell.r, cell.c, extra || {}, cell) || {};
      cell.t.textContent = displayFn(value, cell.r, cell.c, extra || {});
      cell.rect.setAttribute("fill", st.fill || C.chipFill);
      cell.rect.setAttribute("stroke", st.stroke || C.greyDark);
      cell.rect.setAttribute("stroke-width", String(st.strokeWidth || 1.6));
      cell.t.setAttribute("fill", st.text || C.white);
      setOpacity(cell.g, st.opacity === undefined ? 1 : st.opacity);
    }
    if (active && active[0] >= 0) {
      const x = x0 + active[1] * cell;
      const y = y0 + active[0] * cell;
      cursor.setAttribute("x", String(x + gap / 2));
      cursor.setAttribute("y", String(y + gap / 2));
      cursor.setAttribute("stroke", (extra && extra.cursorColor) || C.gold);
      setOpacity(cursor, 1);
    } else {
      setOpacity(cursor, 0);
    }
  };

  const apply = (tl, snapshot, extra, active) => {
    tl.add(0.01, () => applyNow(snapshot, extra, active));
  };

  const reset = () => {
    applyNow(grid, {}, null);
    setOpacity(board, 0);
  };
  reset();
  scene.resetters.push(reset);

  return {
    rows, cols, cell, x0, y0, cells, board, cursor,
    apply, applyNow, reset,
    setStyle(fn) { styleFn = fn; },
    setDisplay(fn) { displayFn = fn; },
    cellAt(r, c) { return cells[r * cols + c]; },
  };
}

function kLines(ctx, scene, opts) {

function kGraph(ctx, scene, opts) {
  const { el, txt, C, setOpacity } = ctx;
  const o = opts || {};
  const nodesIn = o.nodes || [];
  const edgesIn = o.edges || [];
  const n = nodesIn.length;
  const r = o.r || kClamp(Math.min(o.w, o.h) / (Math.max(3, Math.sqrt(Math.max(1, n))) * 3.0), 18, 30);
  const graphG = el("g", {}, scene.layers.chips);
  setOpacity(graphG, 0);
  scene.hideNodes.push(graphG);
  scene.introNodes.push(graphG);
  const cx = o.x + o.w / 2;
  const cy = o.y + o.h / 2;
  const rx = Math.max(0, o.w / 2 - r - (o.padX || 18));
  const ry = Math.max(0, o.h / 2 - r - (o.padY || 18));
  const positions = new Map();
  nodesIn.forEach((node, i) => {
    let x, y;
    if (node.x !== undefined) { x = node.x; y = node.y; }
    else if (o.layout === "row") {
      x = o.x + o.w * (i + 0.5) / Math.max(1, n);
      y = cy;
    } else if (o.layout === "column") {
      x = cx;
      y = o.y + o.h * (i + 0.5) / Math.max(1, n);
    } else if (n === 1) {
      x = cx; y = cy;
    } else {
      const a = -Math.PI / 2 + 2 * Math.PI * i / n;
      x = cx + rx * Math.cos(a);
      y = cy + ry * Math.sin(a);
    }
    positions.set(node.id, { x, y });
  });

  const edgeMap = new Map();
  const edgeNodes = [];
  for (const edge of edgesIn) {
    const a = positions.get(edge.u);
    const b = positions.get(edge.v);
    if (!a || !b) continue;
    let x1 = a.x, y1 = a.y, x2 = b.x, y2 = b.y;
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    x1 += ux * (r + 2); y1 += uy * (r + 2);
    x2 -= ux * (r + 2); y2 -= uy * (r + 2);
    const line = el("line", {
      x1, y1, x2, y2, stroke: C.greyDark, "stroke-width": 2.2,
    }, scene.layers.arcs);
    setOpacity(line, 0);
    let arrow = null;
    if (edge.directed) {
      const bx = x2 - ux * 9, by = y2 - uy * 9;
      const px = -uy * 5, py = ux * 5;
      arrow = el("polygon", {
        points: `${x2},${y2} ${bx + px},${by + py} ${bx - px},${by - py}`,
        fill: C.greyDark,
      }, scene.layers.arcs);
      setOpacity(arrow, 0);
    }
    const key = edge.u + "|" + edge.v;
    const keyR = edge.v + "|" + edge.u;
    const item = { edge, line, arrow, key, keyR };
    edgeMap.set(key, item);
    if (!edge.directed) edgeMap.set(keyR, item);
    edgeNodes.push(item);
  }

  const nodeMap = new Map();
  const nodeNodes = [];
  const font = o.font || kClamp(r * 0.72, 10, 22);
  for (const node of nodesIn) {
    const p = positions.get(node.id);
    const g = el("g", { transform: `translate(${p.x} ${p.y})` }, graphG);
    const circle = el("circle", {
      cx: 0, cy: 0, r, fill: C.chipFill, stroke: C.greyDark, "stroke-width": 2.2,
    }, g);
    const ring = el("circle", {
      cx: 0, cy: 0, r: r + 4, fill: "none", stroke: C.gold,
      "stroke-width": 2.6, filter: "url(#glow-gold)",
    }, g);
    const label = txt(String(node.label === undefined ? node.id : node.label), {
      x: 0, y: 1, "text-anchor": "middle", "dominant-baseline": "central",
      "font-size": font, fill: C.white,
    }, g);
    let badge = null;
    if (node.badge !== undefined) {
      badge = txt(String(node.badge), {
        x: 0, y: r + 14, "text-anchor": "middle", "font-size": 10, fill: C.grey,
      }, g);
    }
    setOpacity(ring, 0);
    const item = { node, g, circle, ring, label, badge, x: p.x, y: p.y, r };
    nodeMap.set(node.id, item);
    nodeNodes.push(item);
  }

  const reset = () => {
    for (const item of nodeNodes) {
      setOpacity(item.g, 1);
      item.circle.setAttribute("fill", C.chipFill);
      item.circle.setAttribute("stroke", C.greyDark);
      item.circle.setAttribute("stroke-width", "2.2");
      item.label.setAttribute("fill", C.white);
      setOpacity(item.ring, 0);
      if (item.badge) { item.badge.setAttribute("fill", C.grey); item.badge.textContent = String(item.node.badge === undefined ? "" : item.node.badge); }
    }
    for (const item of edgeNodes) {
      setOpacity(item.line, 1);
      item.line.setAttribute("stroke", C.greyDark);
      item.line.setAttribute("stroke-width", "2.2");
      setOpacity(item.line, 0);
      if (item.arrow) { item.arrow.setAttribute("fill", C.greyDark); setOpacity(item.arrow, 0); }
    }
  };
  reset();
  scene.resetters.push(reset);

  const apply = (tl, states, edgeStates, badges, active) => {
    tl.add(0.01, () => {
      const stMap = states || {};
      for (const item of nodeNodes) {
        const s = stMap[item.node.id] || {};
        setOpacity(item.g, s.opacity === undefined ? 1 : s.opacity);
        item.circle.setAttribute("fill", s.fill || C.chipFill);
        item.circle.setAttribute("stroke", s.stroke || C.greyDark);
        item.circle.setAttribute("stroke-width", String(s.strokeWidth || 2.2));
        item.label.setAttribute("fill", s.text || C.white);
        setOpacity(item.ring, s.ring ? 1 : 0);
        if (s.ring) item.ring.setAttribute("stroke", s.ringColor || C.gold);
        if (item.badge) {
          item.badge.textContent = badges && badges[item.node.id] !== undefined
            ? String(badges[item.node.id]) : String(item.node.badge === undefined ? "" : item.node.badge);
          item.badge.setAttribute("fill", s.badgeColor || C.grey);
        }
      }
      const esMap = edgeStates || {};
      for (const item of edgeNodes) {
        const s = esMap[item.key] || esMap[item.keyR] || {};
        item.line.setAttribute("stroke", s.stroke || C.greyDark);
        item.line.setAttribute("stroke-width", String(s.strokeWidth || 2.2));
        setOpacity(item.line, s.opacity === undefined ? 1 : s.opacity);
        if (item.arrow) {
          item.arrow.setAttribute("fill", s.arrow || s.stroke || C.greyDark);
          setOpacity(item.arrow, s.opacity === undefined ? 1 : s.opacity);
        }
      }
    });
  };

  return {
    nodes: nodeNodes, edges: edgeNodes, positions, r,
    node(id) { return nodeMap.get(id); },
    edge(u, v) { return edgeMap.get(u + "|" + v) || edgeMap.get(v + "|" + u); },
    apply, reset,
  };
}

function kParseGrid(raw, mode) {
  let text = String(raw || "").trim();
  if (!text) return null;
  if (text[0] === "[") {
    try {
      const data = JSON.parse(text);
      if (!Array.isArray(data) || !data.length || !Array.isArray(data[0])) return null;
      const rows = data.map(row => row.map(v => String(v)));
      if (!rows.every(row => row.length === rows[0].length)) return null;
      return rows;
    } catch (_) {
      return null;
    }
  }
  const lines = text.split(/[\/\n]+/).map(line => line.trim()).filter(Boolean);
  if (!lines.length) return null;
  const rows = lines.map(line => {
    if (mode === "chars") return line.replace(/\s+/g, "").split("");
    return line.split(/[,\s]+/).filter(Boolean);
  });
  if (!rows.length || !rows[0].length) return null;
  if (!rows.every(row => row.length === rows[0].length)) return null;
  return rows;
}

function kParseNumberRows(raw) {
  const rows = kParseGrid(raw, "tokens");
  if (!rows) return null;
  const out = rows.map(row => row.map(v => Number(v)));
  if (!out.every(row => row.every(Number.isFinite))) return null;
  return out;
}

function kParseEdges(raw) {
  let text = String(raw || "").trim();
  if (!text) return [];
  if (text[0] === "[") {
    try {
      const data = JSON.parse(text);
      if (!Array.isArray(data)) return null;
      if (!data.every(e => Array.isArray(e) && e.length >= 2)) return null;
      return data.map(e => e.slice(0, 2).map(Number));
    } catch (_) { return null; }
  }
  const lines = text.split(/[;\n]+/).map(s => s.trim()).filter(Boolean);
  const out = [];
  for (const line of lines) {
    const parts = line.replace(/[\[\]()]/g, "").split(/[,\s]+/).filter(Boolean).map(Number);
    if (parts.length < 2 || !parts.slice(0, 2).every(Number.isFinite)) return null;
    out.push([parts[0], parts[1]]);
  }
  return out;
}
const SCENE = {

      {

        type: "text",
        default: "INF,-1,0,INF/INF,INF,INF,-1/INF,-1,INF,-1/0,-1,INF,INF",

      },
    ],
    legend: [
      { color: "#83C167", text: "gate (0)" },
      { color: "#58C4DD", text: "reachable room" },
      { color: "#F0AC5F", text: "current / just filled" },
      { color: "#FC6255", text: "wall (-1)" },
    ],
  },

  code: [
    "def walls_and_gates(rooms: List[List[int]]) -> List[List[int]]:",
    "    if not rooms or not rooms[0]:",
    "        return rooms",
    "    rows, cols = len(rooms), len(rooms[0])",
    "    queue = deque()",
    "    for r in range(rows):",
    "        for c in range(cols):",
    "            if rooms[r][c] == 0:",
    "                queue.append((r, c))",
    "    while queue:",
    "        r, c = queue.popleft()",
    "        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):",
    "            nr, nc = r + dr, c + dc",
    "            if 0 <= nr < rows and 0 <= nc < cols and rooms[nr][nc] == INF:",
    "                rooms[nr][nc] = rooms[r][c] + 1   # first visit == shortest distance",
    "                queue.append((nr, nc))",
    "    return rooms",
  ],

  read(values) {

      const t = String(v).trim().toUpperCase();
      if (t === "INF" || Number(t) === 2147483647) return "INF";
      const n = Number(t);
      return Number.isFinite(n) ? String(n) : t;
    }));
    if (!grid.every(row => row.every(v => v === "INF" || v === "-1" || v === "0"))) return null;
    return { grid };
  },

  fromArgs(args) {
    if (!Array.isArray(args) || args.length !== 1 || !Array.isArray(args[0])) return null;

  buildScene(params, ctx) {

  buildTimeline(scene, tl, ctx) {

    gv.apply(tl, grid, {}, null);

      } else if (ev.kind === "pop") {

          "filled rooms = " + ev.filled,

        kSay(scene, tl, "pop (" + ev.active[0] + ", " + ev.active[1] + ") · distance " + ev.distance, C.blue,
          "expand to empty rooms that still contain INF", false);
      } else if (ev.kind === "fill") {
        tl.line([12, 13, 14, 15, 16]);
        gv.apply(tl, ev.grid, { cell: ev.cell }, ev.active);
        stats.set(tl, [
          "queue = [" + ev.queue.map(k => "(" + k + ")").join(" ") + "]",
          "current = (" + ev.active[0] + ", " + ev.active[1] + ")",
          "filled (" + ev.cell[0] + ", " + ev.cell[1] + ") = " + ev.distance,
          "filled rooms = " + ev.filled,
        ]);
        kSay(scene, tl, "room (" + ev.cell[0] + ", " + ev.cell[1] + ") → " + ev.distance, C.gold,
          "the first visit is the shortest because BFS explores in distance order", false);
      } else if (ev.kind === "done") {
        tl.line(17);
        gv.apply(tl, ev.grid, {}, null);
        stats.set(tl, [
          "queue = []",
          "current = -",
          "filled rooms = " + ev.filled,
          "unreachable INF = " + ev.infCount,
        ]);
        kSay(scene, tl, "return the rooms grid", C.green,
          ev.infCount ? ev.infCount + " room(s) stayed INF" : "every reachable room has a distance", false);
      }
      tl.wait(0.1);
    }

    return kFinish(scene, tl, "return distances");
  },
};

function simulateWalls(grid) {
  const state = grid.map(row => row.slice());
  const rows = state.length;
  const cols = state[0].length;
  const events = [];
  let queue = [];
  let filled = 0;
  const infCount = () => state.reduce((n, row) => n + row.filter(v => v === "INF").length, 0);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (state[r][c] === "0") queue.push({ r, c });
    }
  }
  const snapshot = (kind, line, extra) => {
    events.push({
      kind, line,
      grid: state.map(row => row.slice()),
      queue: queue.map(q => q.r + "," + q.c),
      filled,
      infCount: infCount(),
      ...(extra || {}),
    });
  };
  snapshot("start", [1, 2, 3, 4, 5, 6, 7, 8, 9], { active: null, cell: null });
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (queue.length) {
    const cur = queue.shift();
    const distance = Number(state[cur.r][cur.c]);
    snapshot("pop", [10, 11], { active: [cur.r, cur.c], cell: null, distance });
    for (const d of dirs) {
      const nr = cur.r + d[0];
      const nc = cur.c + d[1];
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      if (state[nr][nc] !== "INF") continue;
      state[nr][nc] = String(distance + 1);
      filled += 1;
      queue.push({ r: nr, c: nc });
      snapshot("fill", [12, 13, 14, 15, 16], {
        active: [cur.r, cur.c], cell: [nr, nc], distance: distance + 1,
      });
    }
  }
  snapshot("done", 17, { active: null, cell: null });
  return { events, result: filled };
}

</script>
